<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>__PAGE_TITLE__</title>
<style>
:root{--bg:#f4f6fa;--paper:#fff;--ink:#1d2b43;--muted:#60718a;--faint:#8190a5;--line:#e0e7f0;--accent:#3459b8;--soft:#f5f8ff;--teal:#087d71;--gold:#b57924;--left:62%;--size:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 22px;position:relative;z-index:6}.brand{display:flex;align-items:center;gap:11px;min-width:0}.book-logo{border-radius:12px;background:#314f9f;color:#fff;font-weight:800;display:grid;place-items:center;width:38px;height:38px;font-size:20px}.brand-title{font-size:14px;font-weight:750;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.brand-subtitle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.btn{background:#fff;color:#34435b;border:1px solid #dbe3ee;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:650;white-space:nowrap}.btn:hover{background:#f2f6ff}.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.page-chip{font-size:12px;color:var(--muted);white-space:nowrap}
.frame{height:calc(100vh - 70px);display:grid;grid-template-columns:minmax(0,var(--left)) 9px minmax(0,1fr);min-height:0}.lesson-pane{overflow:auto;padding:22px clamp(16px,3vw,45px) 80px;min-width:0;scrollbar-gutter:stable}.resizer{background:#e1e8f1;cursor:col-resize;position:relative}.resizer:after{content:"";display:block;position:absolute;width:3px;height:48px;background:#94a6bb;border-radius:9px;left:3px;top:calc(50% - 24px)}.pdf-pane{background:#e9edf5;display:flex;flex-direction:column;min-width:0;overflow:hidden}.pdf-toolbar{background:#fbfcfe;padding:10px 13px;border-bottom:1px solid #d5dfeb;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}.pdf-toolbar label{font-size:12px;color:var(--muted)}.pdf-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.pdf-controls input{width:54px;padding:6px;border:1px solid #ccd8e6;border-radius:7px;text-align:center;font-size:12px}.pdf-scroll{overflow:auto;min-height:0;height:100%;padding:18px 14px;overscroll-behavior:contain}.pdf-pages{display:flex;flex-direction:column;gap:15px;align-items:center}.pdf-sheet{width:100%;max-width:1300px;box-shadow:0 5px 15px #21345120;background:white;position:relative}.pdf-sheet img{width:100%;display:block;object-fit:contain}.pdf-sheet .pg-tag{position:absolute;bottom:5px;right:7px;background:#ffffffcf;border-radius:5px;font-size:10px;color:#69778a;padding:3px 6px}
.article{max-width:720px;margin:0 auto;padding:5px 4px 35px}.overline{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.12em;margin-bottom:15px}.article h1{font-size:clamp(25px,2.4vw,31px);font-weight:780;line-height:1.38;letter-spacing:-.022em;margin:0 0 16px}.article h2{font-size:21px;font-weight:760;line-height:1.5;margin:34px 0 12px}.article h3{font-size:19px;font-weight:725;line-height:1.45;margin:27px 0 10px}.article p{font-size:var(--size);line-height:1.85;letter-spacing:.012em;margin:0 0 1.1em;text-wrap:pretty}.article strong{font-weight:760;color:#1b3c78}.article .lead{color:#4d617d;line-height:1.85;margin:5px 0 27px;font-size:calc(var(--size) + 1px)}.article .teacher-note{font-size:calc(var(--size) - 2px);color:#65768c;margin:6px 0 23px}.article .lesson-list{padding-left:1.35em;margin:0 0 25px}.article .lesson-list li{font-size:var(--size);line-height:1.8;margin:.5em 0}.article .equation{margin:26px 0 20px;text-align:center;overflow-x:auto;padding:7px 0;color:var(--ink)}.article .equation mjx-container{font-size:124%!important;margin:0!important}.article .eq-caption{color:var(--muted);font-size:13px;line-height:1.65;margin:8px 0 0}.article .plain-latex{font-size:16px;white-space:pre-wrap}.article .worked-steps{margin:0 0 24px;padding-left:1.55em}.article .worked-steps li{line-height:1.75;margin:9px 0;font-size:var(--size)}.article .worked-steps mjx-container{margin:5px 0}.article .figure img{max-width:100%;max-height:420px;object-fit:contain;border-radius:6px}.article .figure{text-align:center;margin:20px 0}.article .figure figcaption{color:var(--muted);font-size:13px}
.action-block{background:#fafcff;border:1px solid #e1e8f3;padding:20px 21px;margin:34px 0;border-radius:14px}.action-block h2{font-size:18px;margin:0 0 10px;letter-spacing:0}.action-block .caption{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}.lab-result{padding:10px 12px;background:#eef4ff;border-radius:8px;font-size:14px;line-height:1.65;overflow-wrap:anywhere}.lab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:13px 0}.field{font-size:12px;font-weight:650;color:#52637a}.field input[type=range]{display:block;width:100%;margin-top:8px}.matrix-table{border-collapse:separate;border-spacing:3px;max-width:100%;margin:9px auto}.matrix-table td{min-width:29px;height:29px;text-align:center;border-radius:4px;background:#e5edf9;font-size:12px;padding:2px}.matrix-table td.selected{background:#e9c88b;color:#52340c}.matrix-table td.outpick{background:#94c6ad;cursor:pointer}.matrix-table td.outpick.active{background:#0c8577;color:white}.matrix-table input{width:34px;font-size:11px;text-align:center;border:1px solid #b6c7d9;border-radius:4px;padding:5px 1px}.lab-matrices{display:flex;flex-wrap:wrap;align-items:flex-start;gap:15px;justify-content:center}.lab-matrices>div{min-width:100px;text-align:center}.lab-matrices b{font-size:12px;color:var(--muted)}.step-sum{margin-top:12px;font-size:13px;line-height:1.8;overflow-wrap:anywhere;background:#f6f7f9;padding:10px 12px;border-radius:8px}.step-sum code{white-space:normal}
.quiz-item{padding:17px 0;border-bottom:1px solid #e4e9f1}.quiz-item:last-child{border-bottom:0}.quiz-text{font-size:15px;font-weight:680;line-height:1.65;margin-bottom:9px}.quiz-options{display:flex;flex-direction:column;gap:7px;margin:9px 0 12px}.quiz-options label{font-size:14px;line-height:1.5;display:flex;gap:8px;align-items:start;cursor:pointer}.quiz-input,.note-box{border:1px solid #cbd7e8;border-radius:8px;padding:10px 11px;background:#fff}.quiz-input{width:150px;font-size:15px}.question-fields{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.question-fields label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.feedback{font-size:13px;line-height:1.65;margin:10px 0 0;color:#5b6c83}.feedback.good{color:#117e62}.feedback.bad{color:#ad5e23}.small-actions{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}.notes{border-top:1px solid #e3e9f1;margin-top:44px;padding-top:20px}.notes h2{font-size:17px}.note-box{min-height:85px;width:100%;resize:vertical;font-size:14px;line-height:1.6}.notes label{font-size:13px;color:#58677d}.lesson-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:28px 0 0}
.mobile-tabs{display:none}.status-flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;background:#1c3153;color:#fff;border-radius:9px;padding:9px 14px;font-size:12px;box-shadow:0 9px 35px #1115;opacity:0;pointer-events:none;transition:opacity .2s}.status-flash.show{opacity:1}
@media(max-width:800px){.top{height:59px;padding:7px 10px}.brand-subtitle,.page-chip{display:none}.brand-title{font-size:12px;max-width:132px}.book-logo{width:31px;height:31px;font-size:16px}.top-actions{gap:4px}.top-actions .btn{padding:6px;font-size:11px}.frame{height:calc(100vh - 107px);display:block}.lesson-pane,.pdf-pane{height:100%;width:100%;display:none}.lesson-pane{padding:13px 14px 65px}.frame[data-tab="lesson"] .lesson-pane{display:block}.frame[data-tab="pdf"] .pdf-pane{display:flex}.resizer{display:none}.mobile-tabs{height:48px;display:flex;border-top:1px solid #dce3ec;background:#fff;gap:1px}.mobile-tabs button{flex:1;border:0;background:#fff;font-weight:700;color:#58677d}.mobile-tabs button.active{color:var(--accent);background:#eef2fa}.article{padding:9px 2px 35px}.article h1{font-size:24px}.article h2{font-size:20px}.article p{font-size:clamp(16px,var(--size),18px);line-height:1.78}.article .lead{font-size:17px}.action-block{padding:16px 12px;margin:27px 0}.pdf-toolbar{padding:8px}.pdf-scroll{padding:10px 6px}}
.page-section{padding-top:20px;margin-bottom:48px;border-top:1px solid var(--line)}.code-block{max-width:100%;overflow-x:auto;padding:16px;background:#f2f5fa;font-size:14px;line-height:1.65}.table-scroll{max-width:100%;overflow-x:auto;margin:24px 0}.lesson-table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}.lesson-table th,.lesson-table td{padding:10px;border:1px solid var(--line);text-align:left;vertical-align:top}.lesson-table th{background:#f2f5fa}
</style>
</head><body>
<header class="top"><div class="brand"><div class="book-logo">学</div><div><div class="brand-title">__BRAND_TITLE__</div><div class="brand-subtitle">__BRAND_SUBTITLE__</div></div></div><div class="top-actions"><span id="page-chip" class="page-chip"></span><button class="btn" id="font-smaller" title="缩小字体">A−</button><button class="btn" id="font-larger" title="放大字体">A＋</button><button class="btn" id="lesson-prev">上一讲</button><button class="btn" id="lesson-next">下一讲</button></div></header>
<div class="frame" id="frame" data-tab="lesson"><main class="lesson-pane" id="lesson-pane"><article class="article" id="article"></article></main><div class="resizer" id="resizer"></div><aside class="pdf-pane" id="pdf-pane"><div class="pdf-toolbar"><label><strong>原始课件 · 独立参考</strong></label><div class="pdf-controls"><button class="btn" id="pdf-prev">◀</button><label><input type="number" min="1" id="pdf-page" value="1"/> / <span id="pdf-total">0</span></label><button class="btn" id="pdf-next">▶</button><button class="btn" id="pdf-zoom-out">－</button><span id="pdf-zoom-label" class="page-chip">100%</span><button class="btn" id="pdf-zoom-in">＋</button></div></div><div class="pdf-scroll" id="pdf-scroll"><div id="pdf-pages" class="pdf-pages"></div></div></aside></div>
